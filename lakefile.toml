name = "rankr"
defaultTargets = ["RankR"]
# Keep RankR's existing import semantics when consuming Mathlib modules.
allowNonModules = true

# Mathlib is the only dependency.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "RankR"
